name: policy-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate policy pack
        run: python scripts/validate_policy.py
      - name: Compile hook scripts
        run: python -m py_compile plugin/hooks/*.py scripts/*.py
